name: deploy to Azure Static Web Apps

# Needs one repository secret: AZURE_STATIC_WEB_APPS_API_TOKEN, the deployment token
# from the Static Web App's Overview blade. Pull requests get a preview environment;
# closing the PR tears it down. See docs/deploy-azure.md.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build_and_deploy:
    if: (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Validate the library records
        run: python3 tools/test_library.py && python3 tools/build_library.py --check

      - name: Build the catalogue
        run: python3 tools/build_library.py

      - name: Test the app logic
        run: node tools/test_app.mjs

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app
          api_location: api
          output_location: ''
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
