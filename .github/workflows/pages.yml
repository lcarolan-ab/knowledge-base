name: publish the demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Validate the library records
        run: python3 tools/test_library.py && python3 tools/build_library.py --check
      - name: Build the catalogue
        run: python3 tools/build_library.py
      - name: Test the app logic
        run: node tools/test_app.mjs
      - name: Assemble the site
        run: |
          mkdir -p site && cp -R app/. site/ && rm -f site/staticwebapp.config.json && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
