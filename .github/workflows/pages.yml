name: build and publish the LLM wiki

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # The linters are the gate. Publishing a wiki that fails its own
      # invariants would defeat the point of having them.
      - name: Test the Python tooling
        run: python3 tools/test_wiki.py

      - name: Lint the wiki
        run: python3 tools/wiki.py lint

      - name: Check nothing needs recompiling
        run: python3 tools/wiki.py status

      - name: Rebuild the app's seed data from wiki/
        run: python3 tools/build_app.py

      - name: Test the app logic
        run: node tools/test_app.mjs

      - name: Build the app (site root)
        run: |
          mkdir -p site
          cp -R app/. site/
          touch site/.nojekyll

      - name: Build the no-JavaScript archive (site/read)
        run: python3 tools/build_site.py --out site/read

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    # Only publish from main; pull requests run the checks above and stop.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
